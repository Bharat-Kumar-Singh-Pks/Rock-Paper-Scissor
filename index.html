<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Rock Paper Scissor</title>

</head>


<body>
  <h4>Rock Paper Scissor</h4>
  <h5>Choose any one..</h5>

<!-- rock button -->
  <button class="r" onclick="    
    let playerMove='Rock';
    calculateMoves(playerMove);
    ">Rock</button>

<!-- paper button -->
  <button class="p" onclick="
    playerMove='Paper';
    calculateMoves(playerMove);
    ">Paper</button>

<!-- scissor button -->
<button class="s" onclick="
    playerMove='Scissor';
    calculateMoves(playerMove);
    ">Scissor</button><br><br>

<p class="paraDecision"></p>
<p class="result"></p>
<p class="paraScore"></p>

 <!-- reset button -->
    <button class="reset" onclick="
    resetMoves();
    ">Reset</button>

<script src="js/script.js">
</script>

</body>
</html>
