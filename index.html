 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rock Paper Scissors</title>

  <link rel="stylesheet" href="css/style.css">
</head>


<body>
  <div class="game-container">

    <h1>🎮 Rock Paper Scissors</h1>

    <p class="subtitle">
      Choose your move and challenge the computer!
    </p>


    <!-- Game choices -->
    <div class="choices">

      <!-- Rock -->
      <button class="choice" onclick="
          let playerMove = 'Rock';
          calculateMoves(playerMove);
        "><img class="bi" src="img/rock.png" alt="Rock">
      </button>


      <!-- Paper -->
      <button class="choice" onclick="
          playerMove = 'Paper';
          calculateMoves(playerMove);
        "><img class="bi" src="img/paper.png" alt="Paper">
      </button>


      <!-- Scissor -->
      <button class="choice" onclick="
          playerMove = 'Scissor';
          calculateMoves(playerMove);
        "><img class="bi" src="img/scissor.png" alt="Scissor" >
      </button>

    </div>


    <!-- Decision -->
    <div class="decision-box">
      <p class="paraDecision">
        Make your move!
      </p>
    </div>


    <!-- Result -->
    <p class="result"></p>


    <!-- Score -->
    <div class="score-card">

      <p class="score-title">
        🏆 Score Board
      </p>

      <p class="paraScore">
        Win : 0 | Lose : 0 | Tie : 0
      </p>

    </div>


    <!-- Reset -->
    <button class="reset" onclick="resetMoves();">
      🔄 Reset Game
    </button>

  </div>


  <script src="js/script.js">
  </script>

</body>
</html>
