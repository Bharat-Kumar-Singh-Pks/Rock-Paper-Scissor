<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissor...</title>
</head>
<link rel="stylesheet" href="css/style.css">

<body>
  <h2>Rock Paper Scissor</h2>
  <h4>Choose Any One..</h4>

<!-- rock button -->
  <button class="r" onclick="    
    let playerMove='Rock';
    calculateMoves(playerMove);
    "><img class="bi" src="img/rock.png"></button>

<!-- paper button -->
  <button class="p" onclick="
    playerMove='Paper';
    calculateMoves(playerMove);
    "><img class="bi" src="img/paper.png"></button>

<!-- scissor button -->
  <button class="s" onclick="
    playerMove='Scissor';
    calculateMoves(playerMove);
    "><img class="bi" src="img/scissor.png"></button><br><br>

<p class="paraDecision"></p>
<p class="result"></p>
<p class="paraScore"></p>

 <!-- reset button -->
    <button class="reset" onclick="
    resetMoves();
    ">Reset</button>

</body>


  <script src="js/script.js">
</script>
</html>
